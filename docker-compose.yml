version: "3.8"
services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ferresync_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ferresync
      POSTGRES_PASSWORD: ferresync123
      POSTGRES_DB: ferresync_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
